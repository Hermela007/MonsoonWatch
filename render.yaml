services:
  - type: web
    name: monsoonwatch
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm typecheck && corepack pnpm build
    startCommand: node --import ./apps/api/node_modules/tsx/dist/loader.mjs apps/api/src/index.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.21.0
      - key: NODE_ENV
        value: production
      - key: MOCK
        value: "0"
      - key: REGION_ID
        value: kelantan
      - key: PUBLIC_DEMO
        value: "1"
      - key: AGENT_AUTO_RUN
        value: "0"
      - key: MONGODB_DB
        value: monsoonwatch
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
