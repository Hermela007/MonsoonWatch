<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Saint integration checks</title>
<style>body{font:15px system-ui;margin:24px;background:#f5f3ef;color:#222}main{max-width:620px}button,input,textarea{font:inherit;padding:8px;margin:5px 0}label,textarea,input{display:block}textarea{width:95%}.tasks{padding:0;list-style:none}.task{border-top:1px solid #ccc;padding:12px 0;display:grid;gap:8px}.saint-actions{display:grid;gap:6px}.note{color:#555}pre{white-space:pre-wrap}</style>
<main><h1>Saint handoff checks</h1><p>Isolated test data. WhatsApp windows and API calls are simulated; no messages are sent.</p>
<button id="run">Run integration checks</button><pre id="checks" role="status"></pre>
<section id="saint-box"><h2>After approval · Saint (Thea)</h2><ul id="saint-list" class="tasks"></ul>
<label for="saint-by">Duty officer</label><input id="saint-by" value="Test officer">
<label for="saint-report">Paste the village head’s check-in</label><textarea id="saint-report" rows="4"></textarea>
<button id="saint-submit">Apply report</button><div id="saint-result" role="status"></div><p id="saint-capacity"></p></section></main>
<script type="module" src="./saint-preview.ts"></script></html>
