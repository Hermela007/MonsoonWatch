<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f2ee" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>MonsoonWatch · Is my home safe?</title>
  </head>
  <body data-view="landing">
    <div id="app"></div>

    <div id="loading">
      <div class="brand">Monsoon<span>Watch</span></div>
      <div id="loading-msg">Loading the valley…</div>
      <div class="bar"><i id="loading-bar"></i></div>
    </div>

    <header class="topbar ui">
      <div class="brand">Monsoon<span>Watch</span></div>
      <div class="clock"><b id="clock-tag">Now</b><span id="clock-time"></span></div>
    </header>

    <section id="landing" class="card ui" aria-labelledby="ask-title">
      <h1 id="ask-title" data-copy="askTitle"></h1>
      <p class="sub" data-copy="askSub"></p>
      <form id="place-form" autocomplete="off">
        <input id="place-input" type="search" inputmode="search" enterkeyhint="go" aria-label="Your town or village" />
      </form>
      <div id="suggestions" class="suggestions"></div>
      <button id="btn-locate" class="btn btn-ghost" type="button">📍 <span data-copy="useLocation"></span></button>
      <p id="landing-note" class="note" role="status"></p>
      <p class="footer" data-copy="footer"></p>
    </section>

    <section id="result" class="card ui" aria-live="polite">
      <div class="place-row">
        <span id="place-name" class="place"></span>
        <button id="btn-change" class="link" type="button" data-copy="change"></button>
      </div>
      <div id="risk-level" class="risk-level"></div>
      <div id="risk-lines" class="risk-lines"></div>
      <div id="risk-action" class="risk-action"></div>
      <div id="street-info" class="street-info">
        <div id="street-stats" class="street-stats"></div>
        <div class="roof-key"><span data-copy="roofKey"></span>
          <i style="--c:#f4f2ee"></i>Dry <i style="--c:#d4ecf8"></i>&lt;0.5 m <i style="--c:#8fc9ea"></i>0.5–1.5 m <i style="--c:#2f8ccc"></i>&gt;1.5 m <i style="--c:#d4542b"></i>Landslide
        </div>
        <div id="street-source" class="street-source"></div>
      </div>
      <div class="actions">
        <button id="btn-street" class="btn btn-street" type="button" data-copy="seeStreet"></button>
        <button id="btn-way" class="btn btn-primary" type="button" data-copy="showWay"></button>
        <button id="btn-whatif" class="btn" type="button" data-copy="whatIf"></button>
        <button id="btn-listen" class="btn btn-ghost" type="button"></button>
      </div>
      <p class="footer" data-copy="footer"></p>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
